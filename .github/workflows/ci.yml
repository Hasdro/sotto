# CI for every PR and every push to main (P1.6). Mirrors what a contributor runs locally:
# pnpm typecheck · pnpm lint (Biome, ruff, boundaries) · pnpm test · web export · audits · gitleaks.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: apps/agent-worker
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Card protocol codegen is up to date
        run: pnpm gen && git diff --exit-code -- packages/shared/schema apps/agent-worker/sotto_worker/protocol
      - name: Web build exports
        run: pnpm --filter @sotto/app export:web
        env:
          CI: "1"
          EXPO_OFFLINE: "1"
      - name: Web bundle budget
        run: python3 scripts/check_bundle_size.py apps/app/dist

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v6
      - name: npm advisories (production dependencies, high and above)
        run: pnpm audit --prod --audit-level high
      - name: Python advisories
        working-directory: apps/agent-worker
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict --requirement "$RUNNER_TEMP/requirements.txt"

  gitleaks:
    name: secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git --redact --no-banner --verbose /repo
