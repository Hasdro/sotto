<style>
/* Layout: sticky header with tabs; one column of cards per tab; every card has its own Short/Detailed switch. Terms with a definition use --term colour + dotted underline. */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --ink:#13231D; --muted:#5B6B65; --line:#D6DFDA;
  --brand:#0E6B55; --brand-ink:#FFFFFF; --brand-soft:#DDEFE8;
  --term:#6A3FB5; --term-soft:#EEE7FA;
  --ok:#1D7A3B; --ok-soft:#DFF2E4; --warn:#8C5A00; --warn-soft:#FBEBD0; --bad:#B23A30; --bad-soft:#F8E1DE;
  --display:"Readex Pro",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1512; --surface:#14201B; --ink:#E2ECE7; --muted:#97A9A1; --line:#26362F;
  --brand:#4FC9A6; --brand-ink:#062019; --brand-soft:#123A2F;
  --term:#C3A6FF; --term-soft:#2A2140;
  --ok:#6FD48D; --ok-soft:#12301C; --warn:#F0B95C; --warn-soft:#3A2A10; --bad:#F2877C; --bad-soft:#3A1B18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1512; --surface:#14201B; --ink:#E2ECE7; --muted:#97A9A1; --line:#26362F;
  --brand:#4FC9A6; --brand-ink:#062019; --brand-soft:#123A2F;
  --term:#C3A6FF; --term-soft:#2A2140;
  --ok:#6FD48D; --ok-soft:#12301C; --warn:#F0B95C; --warn-soft:#3A2A10; --bad:#F2877C; --bad-soft:#3A1B18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:12px 4px}
.top h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.top .stamp{font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.spacer{flex:1}
.allbtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 13px var(--display);padding:6px 12px;border-radius:999px;cursor:pointer}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-block:6px 8px;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;border:0;background:none;color:var(--muted);font:500 14px var(--display);padding:7px 12px;border-radius:8px;cursor:pointer;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-selected="true"]{background:var(--brand-soft);color:var(--brand)}
nav.tabs .n{font:500 11px var(--mono);background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:0 6px}
button:focus-visible,.term:focus-visible,label.opt:focus-within{outline:2px solid var(--brand);outline-offset:2px}
main .wrap{display:grid;gap:14px;padding-block:20px 72px}
.lead{margin:0 0 4px;color:var(--muted);max-width:70ch}
h2.tabtitle{margin:4px 0 0;font-size:24px;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px;min-width:0}
.chead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.chead h3{margin:0;font-size:17px;font-weight:600;text-wrap:balance}
.eyebrow{font:500 11px var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sw{flex:0 0 auto;display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg)}
.sw button{border:0;background:none;color:var(--muted);font:500 12px var(--display);padding:4px 10px;border-radius:999px;cursor:pointer}
.sw button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.body p{margin:0 0 8px;max-width:72ch}
.body p:last-child{margin-bottom:0}
.body ul{margin:0;padding-left:20px;display:grid;gap:5px}
.card .full{display:none}
.card.detailed .short{display:none}
.card.detailed .full{display:block}
.term{color:var(--term);text-decoration:underline dotted;text-underline-offset:3px;cursor:help;border-radius:3px}
.term:hover{background:var(--term-soft)}
#tip{position:fixed;z-index:30;max-width:300px;background:var(--ink);color:var(--surface);font-size:13.5px;line-height:1.45;padding:9px 12px;border-radius:9px;pointer-events:none;box-shadow:0 8px 24px -10px rgba(0,0,0,.4)}
#tip b{display:block;font-size:12px;opacity:.75;margin-bottom:2px}
.pill{display:inline-flex;align-items:center;font:500 11px var(--mono);letter-spacing:.04em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.run{background:var(--brand-soft);color:var(--brand)}
.meterbar{height:14px;border-radius:999px;background:var(--line);overflow:hidden;display:flex}
.meterbar i{display:block;height:100%}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big strong{font-size:40px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
tr:last-child td{border-bottom:0}
.opts{display:grid;gap:7px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
label.opt.on{border-color:var(--brand);background:var(--brand-soft)}
label.opt input{margin:4px 0 0;accent-color:var(--brand)}
.olab{font-weight:500}
.rec{font:500 10px var(--mono);color:var(--brand);margin-left:6px;letter-spacing:.06em;text-transform:uppercase}
.odesc{display:block;color:var(--muted);font-size:13.5px}
.card:not(.detailed) .odesc{display:none}
textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:14px var(--display);color:var(--ink);background:var(--bg);resize:vertical}
.savebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.savebar p{margin:0;color:var(--muted)}
.btn{border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:500 14px var(--display);padding:8px 16px;border-radius:10px;cursor:pointer}
.save{font:500 12px var(--mono);color:var(--muted)}
.plat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:860px){.plat{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.plat{grid-template-columns:1fr}}
.metro{display:grid;gap:10px}
.phase{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start}
.dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:600 15px var(--mono);border:2px solid var(--line);background:var(--surface)}
.dot.run{border-color:var(--brand);color:var(--brand)} .dot.done{background:var(--ok);border-color:var(--ok);color:var(--surface)} .dot.wait{border-color:var(--warn);color:var(--warn)}
.pbar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brand)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:720px){.cols{grid-template-columns:1fr}}
.cols h4{margin:0 0 4px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cols ul{font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:10px;font-size:14px;z-index:40}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rich(text){
  return esc(text).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, shown, key) => {
    const k = key || shown; const def = TERMS[k];
    return def ? `<span class="term" tabindex="0" data-k="${esc(k)}">${shown}</span>` : shown;
  });
}
let detailed = {}; try { detailed = JSON.parse(localStorage.getItem("hub.detail") || "{}"); } catch {}
let tab = "overview"; try { tab = location.hash.slice(1) || localStorage.getItem("hub.tab") || "overview"; } catch {}
if (!TABS.some(t => t.id === tab)) tab = "overview";

function card({id, eyebrow, title, short, full, extra = ""}){
  const isD = !!detailed[id];
  const fullHtml = Array.isArray(full) ? full.map(p => `<p>${rich(p)}</p>`).join("") : `<p>${rich(full || "")}</p>`;
  return `<article class="card${isD ? " detailed" : ""}" data-id="${id}">
    <div class="chead"><div>${eyebrow ? `<div class="eyebrow">${esc(eyebrow)}</div>` : ""}<h3>${rich(title)}</h3></div>
      <div class="sw" role="group" aria-label="Format for ${esc(title)}"><button type="button" data-f="s" aria-pressed="${!isD}">Short</button><button type="button" data-f="d" aria-pressed="${isD}">Detailed</button></div></div>
    <div class="body"><div class="short"><p>${rich(short)}</p></div><div class="full">${fullHtml}</div>${extra}</div></article>`;
}

function renderTabs(){
  $("#tabs").innerHTML = TABS.map(t => `<button type="button" role="tab" data-t="${t.id}" aria-selected="${t.id === tab}">${esc(t.label)}${t.badge && t.badge() ? `<span class="n">${t.badge()}</span>` : ""}</button>`).join("");
}
const views = {
 overview(){
  const o = OVERVIEW;
  const meter = `<div class="card"><div class="eyebrow">Overall progress</div><div class="big"><strong>${o.pct}%</strong><span class="lead">of the full product</span></div>
   <div class="meterbar" role="img" aria-label="${o.parts.map(p => p.label + " " + p.v + "%").join(", ")}">${o.parts.map(p => `<i style="width:${p.v}%;background:${p.c}"></i>`).join("")}</div>
   <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)">${o.parts.map(p => `<span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${p.c};margin-right:5px;vertical-align:-1px"></i>${p.label} ${p.v}%</span>`).join("")}</div></div>`;
  return `<h2 class="tabtitle">Where we are</h2><p class="lead">Each card has a Short and a Detailed view. Purple underlined words show a definition when you hover or tap.</p>${meter}<div class="grid2">${o.cards.map((c, i) => card({id:"o" + i, ...c})).join("")}</div>`;
 },
 decisions(){
  return `<h2 class="tabtitle">Your decisions</h2><p class="lead">${rich(DECISIONS_LEAD)}</p>
   ${DECISIONS.map(d => card({id:"d-" + d.id, eyebrow:"Decision", title:d.title, short:d.short, full:d.full, extra:optsHtml(d)})).join("")}
   <div class="savebar"><p id="saveMsg">Nothing changed yet.</p><span class="save" id="saveState"></span><button type="button" class="btn" id="saveBtn">Save my choices</button></div>`;
 },
 server(){
  return `<h2 class="tabtitle">Server (us3)</h2><p class="lead">Your server only manages accounts and subscriptions. Calls never pass through it.</p>${SERVER.map((c, i) => card({id:"s" + i, ...c})).join("")}`;
 },
 apps(){
  const pill = p => `<span class="pill ${p.st}">${esc(p.stl)}</span>`;
  return `<h2 class="tabtitle">Apps & platforms</h2><p class="lead">One codebase for every platform. Your priority: phones, Windows and Mac.</p>
   <div class="plat">${PLATFORMS.map((p, i) => card({id:"p" + i, eyebrow:p.prio ? "Priority" : "Platform", title:p.name, short:p.short, full:p.full, extra:`<div>${pill(p)}</div>`})).join("")}</div>`;
 },
 map(){
  const avg = Math.round(PHASES.reduce((a, p) => a + p.pct, 0) / PHASES.length);
  return `<h2 class="tabtitle">Build map</h2><p class="lead">Nine phases from idea to pilot; average phase completion ${avg}%. Switch a phase to Detailed to see what is done, what is next, and what is waiting on you.</p>
   <div class="metro">${PHASES.map(p => {
     const li = a => a.length ? `<ul>${a.map(x => `<li>${rich(x)}</li>`).join("")}</ul>` : `<p class="lead">Nothing</p>`;
     const extra = `<div class="pbar" role="img" aria-label="${p.pct}% done"><i style="width:${p.pct}%"></i></div><div class="full"><div class="cols"><div><h4>Done</h4>${li(p.done)}</div><div><h4>Next</h4>${li(p.next)}</div><div><h4>Needs you</h4>${li(p.you)}</div></div></div>`;
     return `<div class="phase"><div class="dot ${p.pct >= 100 ? "done" : p.st}">${p.n}</div>${card({id:"m" + p.n, eyebrow:`Phase ${p.n} · ${p.pct}%`, title:p.name, short:p.short, full:[], extra})}</div>`;
   }).join("")}</div>`;
 }
};
const isRec = (d, v) => d.multi ? d.rec.includes(v) : d.rec === v;
const isOn = (d, cur, v) => d.multi ? (cur || []).includes(v) : cur === v;
function optsHtml(d){
  const cur = choices[d.id]?.v ?? d.rec;
  const type = d.multi ? "checkbox" : "radio";
  return `<div class="opts" role="${d.multi ? "group" : "radiogroup"}" aria-label="${esc(d.title)}">${d.options.map(o => `<label class="opt${isOn(d, cur, o.v) ? " on" : ""}"><input type="${type}" name="dc-${d.id}" id="dc-${d.id}-${o.v}" value="${o.v}"${isOn(d, cur, o.v) ? " checked" : ""}><span><span class="olab">${esc(o.l)}</span>${isRec(d, o.v) ? '<span class="rec">Recommended</span>' : ""}<span class="odesc">${rich(o.d || "")}</span></span></label>`).join("")}</div>
   <textarea id="dn-${d.id}" placeholder="Optional note" aria-label="Note for ${esc(d.title)}">${esc(choices[d.id]?.note || "")}</textarea>`;
}
function render(){
  renderTabs();
  $("#stamp").textContent = "Updated " + UPDATED;
  $("#panel").innerHTML = views[tab]();
  if (tab === "decisions") wireDecisions();
}

document.addEventListener("click", e => {
  const b = e.target.closest(".sw button");
  if (b){ const c = b.closest(".card"); const d = b.dataset.f === "d"; detailed[c.dataset.id] = d; c.classList.toggle("detailed", d);
    c.querySelectorAll(".sw button").forEach(x => x.setAttribute("aria-pressed", String((x.dataset.f === "d") === d)));
    try { localStorage.setItem("hub.detail", JSON.stringify(detailed)); } catch {} return; }
  const t = e.target.closest("nav.tabs button");
  if (t){ tab = t.dataset.t; try { localStorage.setItem("hub.tab", tab); } catch {} render(); window.scrollTo(0, 0); }
});
function setAll(d){ document.querySelectorAll(".card").forEach(c => { detailed[c.dataset.id] = d; }); try { localStorage.setItem("hub.detail", JSON.stringify(detailed)); } catch {} render(); }
$("#allShort").onclick = () => setAll(false); $("#allFull").onclick = () => setAll(true);

const tip = $("#tip");
function showTip(el){ const k = el.dataset.k; tip.innerHTML = `<b>${esc(k)}</b>${esc(TERMS[k] || "")}`; tip.hidden = false;
  const r = el.getBoundingClientRect(); const w = Math.min(300, window.innerWidth - 24);
  tip.style.maxWidth = w + "px"; const x = Math.max(12, Math.min(r.left, window.innerWidth - w - 12));
  tip.style.left = x + "px"; const below = r.bottom + 8; tip.style.top = (below + tip.offsetHeight > window.innerHeight - 10 ? r.top - tip.offsetHeight - 8 : below) + "px"; }
document.addEventListener("mouseover", e => { const t = e.target.closest(".term"); if (t) showTip(t); });
document.addEventListener("mouseout", e => { if (e.target.closest(".term")) tip.hidden = true; });
document.addEventListener("focusin", e => { const t = e.target.closest(".term"); if (t) showTip(t); });
document.addEventListener("focusout", e => { if (e.target.closest(".term")) tip.hidden = true; });
window.addEventListener("scroll", () => { tip.hidden = true; }, {passive:true});

let choices = {}; let ref = null; let dirty = false;
try { choices = JSON.parse(localStorage.getItem("hub.choices") || "{}"); } catch {}
function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
function wireDecisions(){
  for (const d of DECISIONS){
    document.querySelectorAll(`input[name="dc-${d.id}"]`).forEach(inp => inp.addEventListener("change", () => {
      const v = d.multi ? [...document.querySelectorAll(`input[name="dc-${d.id}"]:checked`)].map(x => x.value) : inp.value;
      choices[d.id] = {...(choices[d.id] || {}), v}; dirty = true; local();
      document.querySelectorAll(`input[name="dc-${d.id}"]`).forEach(x => x.closest("label").classList.toggle("on", x.checked)); msg(); }));
    const ta = $("#dn-" + d.id); ta.addEventListener("input", () => { choices[d.id] = {...(choices[d.id] || {v:d.rec}), note: ta.value}; dirty = true; local(); msg(); });
  }
  $("#saveBtn").onclick = save; msg();
}
function local(){ try { localStorage.setItem("hub.choices", JSON.stringify(choices)); } catch {} }
function msg(){ const el = $("#saveMsg"); if (!el) return;
  const changed = DECISIONS.filter(d => choices[d.id] && JSON.stringify(choices[d.id].v) !== JSON.stringify(d.rec)).length;
  el.textContent = dirty ? `Unsaved changes. ${changed} differ from my recommendation.` : (choices._savedAt ? `Saved ${new Date(choices._savedAt).toLocaleString()}.` : "Nothing saved yet. Saving with no changes means you accept all my recommendations.");
  const s = $("#saveState"); if (s) s.textContent = ref ? "connected" : "this browser only"; }
async function save(){
  const out = {}; for (const d of DECISIONS) out[d.id] = {v: choices[d.id]?.v ?? d.rec, note: choices[d.id]?.note || "", recommended: d.rec};
  choices._savedAt = new Date().toISOString(); local(); dirty = false;
  if (!ref){ msg(); toast("Saved in this browser only (not connected)"); return; }
  try { await ref.set({answers: out, savedAt: choices._savedAt}); toast("Saved. Claude will read these next round."); }
  catch { toast("Could not save. Try again."); }
  msg();
}
render();
(async () => {
  let db = null; try { db = window.claude?.use ? await window.claude.use("db") : null; } catch {}
  if (!db) return;
  ref = db.doc("decisions/owner");
  ref.onSnapshot(snap => { if (snap.exists && !dirty){ const a = snap.data().answers || {}; for (const k in a) choices[k] = {v:a[k].v, note:a[k].note || ""}; choices._savedAt = snap.data().savedAt; local(); render(); } }, () => {});
  msg();
})();
</script>
