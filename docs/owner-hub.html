<style>

:root{

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1512; --surface:#14201B; --ink:#E2ECE7; --muted:#97A9A1; --line:#26362F;
  --brand:#4FC9A6; --brand-ink:#062019; --brand-soft:#123A2F;
  --term:#C3A6FF; --term-soft:#2A2140;
  --ok:#6FD48D; --ok-soft:#12301C; --warn:#F0B95C; --warn-soft:#3A2A10; --bad:#F2877C; --bad-soft:#3A1B18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1512; --surface:#14201B; --ink:#E2ECE7; --muted:#97A9A1; --line:#26362F;
  --brand:#4FC9A6; --brand-ink:#062019; --brand-soft:#123A2F;
  --term:#C3A6FF; --term-soft:#2A2140;
  --ok:#6FD48D; --ok-soft:#12301C; --warn:#F0B95C; --warn-soft:#3A2A10; --bad:#F2877C; --bad-soft:#3A1B18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:12px 4px}
.top h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.top .stamp{font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.spacer{flex:1}
.allbtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 13px var(--display);padding:6px 12px;border-radius:999px;cursor:pointer}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-block:6px 8px;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;border:0;background:none;color:var(--muted);font:500 14px var(--display);padding:7px 12px;border-radius:8px;cursor:pointer;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-selected="true"]{background:var(--brand-soft);color:var(--brand)}
nav.tabs .n{font:500 11px var(--mono);background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:0 6px}
button:focus-visible,.term:focus-visible,label.opt:focus-within{outline:2px solid var(--brand);outline-offset:2px}
main .wrap{display:grid;gap:14px;padding-block:20px 110px}
.lead{margin:0 0 4px;color:var(--muted);max-width:70ch}
h2.tabtitle{margin:4px 0 0;font-size:24px;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px;min-width:0}
.chead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.chead h3{margin:0;font-size:17px;font-weight:600;text-wrap:balance}
.eyebrow{font:500 11px var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sw{flex:0 0 auto;display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg)}

.body p{margin:0 0 8px;max-width:72ch}
.body p:last-child{margin-bottom:0}
.body ul{margin:0;padding-left:20px;display:grid;gap:5px}
.card .full{display:none}
.card.detailed .short{display:none}
.card.detailed .full{display:block}
.term{color:var(--term);text-decoration:underline dotted;text-underline-offset:3px;cursor:help;border-radius:3px}
.term:hover{background:var(--term-soft)}

#tip b{display:block;font-size:12px;opacity:.75;margin-bottom:2px}

.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.run{background:var(--brand-soft);color:var(--brand)}

.opts{display:grid;gap:7px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
label.opt.on{border-color:var(--brand);background:var(--brand-soft)}
label.opt input{margin:4px 0 0;accent-color:var(--brand)}
.olab{font-weight:500}
.rec{font:500 10px var(--mono);color:var(--brand);margin-left:6px;letter-spacing:.06em;text-transform:uppercase}
.odesc{display:block;color:var(--muted);font-size:13.5px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .what{flex:1 1 260px;min-width:0}
select{font:14px var(--display);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.group{font:500 11px var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:10px 0 0}
.card:not(.detailed) .odesc{display:none}
textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:14px var(--display);color:var(--ink);background:var(--bg);resize:vertical}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.savebar .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

.btn{border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:500 14px var(--display);padding:8px 16px;border-radius:10px;cursor:pointer}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<header>

<script>

 "speech-to-text":"The service that turns the customer's voice into words, live.",

};

const TABS = [
 {id:"waiting", label:"Waiting on you", badge:()=>DECISIONS.filter(d => d.kind !== "test" && !saved(d.id)).length},
 {id:"ideas", label:"Suggestions", badge:()=>IDEAS.filter(d => !saved(d.id)).length}
];

const WAITING_LEAD = "Only what I need from you. The new Sotto is in your Applications folder and the server is updated. Try each item on your Mac and mark it, answer the decisions (my pick is pre-selected), then press Save at the bottom.";

/* kind: test (pick list per row, no recommendation), radio, multi (checkbox per item), select (pick list). */
const DECISIONS = [
 {id:"test_r1", kind:"test", eyebrow:"Test on your Mac", title:"This round's new features",
  short:"Open Sotto from Applications, then mark each line. 'Problem' plus a note is all I need.",

   {v:"remind", l:"Keep recording on, with a reminder on the call screen", d:"The agent tells the customer."},
   {v:"off", l:"Recording off unless the agent turns it on", d:"Fewer recordings to review."},

 {id:"backup", kind:"radio", eyebrow:"Decision", title:"Where the off-server backup goes",
  short:"Recommended: Backblaze B2. At today's size it costs a few cents a month, with a nightly copy and a monthly restore test.",

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rich(text){
  return esc(text).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, shown, key) => {
    const k = key || shown; const def = TERMS[k];
    return def ? `<span class="term" tabindex="0" data-k="${esc(k)}">${shown}</span>` : shown;
  });
}
let detailed = {}; try { detailed = JSON.parse(localStorage.getItem("hub.detail") || "{}"); } catch {}
let tab = "waiting"; try { tab = location.hash.slice(1) || localStorage.getItem("hub.tab") || "waiting"; } catch {}
if (!TABS.some(t => t.id === tab)) tab = "waiting";

const ALL = () => [...DECISIONS, ...IDEAS.map(d => ({...d, kind:"multi"}))];
const byId = id => ALL().find(d => d.id === id);
const TEST_OPTS = [{v:"", l:"Not tried yet"},{v:"works", l:"Works"},{v:"problem", l:"Problem (see note)"}];
const recOf = d => d.kind === "test" ? Object.fromEntries(d.rows.map(r => [r.v, ""])) : d.rec;

function card({id, eyebrow, title, short, full, extra = ""}){
  const isD = !!detailed[id];
  const fullHtml = Array.isArray(full) ? full.map(p => `<p>${rich(p)}</p>`).join("") : `<p>${rich(full || "")}</p>`;
  return `<article class="card${isD ? " detailed" : ""}" data-id="${id}">
    <div class="chead"><div>${eyebrow ? `<div class="eyebrow">${esc(eyebrow)}</div>` : ""}<h3>${rich(title)}</h3></div>
      <div class="sw" role="group" aria-label="Format for ${esc(title)}"><button type="button" data-f="s" aria-pressed="${!isD}">Short</button><button type="button" data-f="d" aria-pressed="${isD}">Detailed</button></div></div>
    <div class="body"><div class="short"><p>${rich(short)}</p></div><div class="full">${fullHtml}</div>${extra}</div></article>`;
}

function controls(d){
  const cur = choices[d.id]?.v ?? recOf(d);
  let html = "";
  if (d.kind === "test"){
    html = `<div>${d.rows.map(r => `<div class="row"><span class="what">${rich(r.l)}</span><select data-d="${d.id}" data-row="${r.v}" aria-label="${esc(r.l.replace(/\[\[|\]\]/g, ""))}">${TEST_OPTS.map(o => `<option value="${o.v}"${(cur[r.v] || "") === o.v ? " selected" : ""}>${o.l}</option>`).join("")}</select></div>`).join("")}</div>`;
  } else if (d.kind === "select"){
    html = `<select data-d="${d.id}" aria-label="${esc(d.title)}">${d.options.map(o => `<option value="${o.v}"${cur === o.v ? " selected" : ""}>${esc(o.l)}${o.v === d.rec ? " — Recommended" : ""}</option>`).join("")}</select>`;
  } else {
    const multi = d.kind === "multi"; const on = v => multi ? (cur || []).includes(v) : cur === v;
    const isRec = v => multi ? d.rec.includes(v) : d.rec === v;
    html = `<div class="opts" role="${multi ? "group" : "radiogroup"}" aria-label="${esc(d.title)}">${d.options.map(o => `<label class="opt${on(o.v) ? " on" : ""}"><input type="${multi ? "checkbox" : "radio"}" name="dc-${d.id}" data-d="${d.id}" value="${o.v}"${on(o.v) ? " checked" : ""}><span><span class="olab">${esc(o.l)}</span>${isRec(o.v) ? '<span class="rec">Recommended</span>' : ""}<span class="odesc">${rich(o.d || "")}</span></span></label>`).join("")}</div>`;
  }
  return html + `<textarea data-note="${d.id}" placeholder="Optional note" aria-label="Note for ${esc(d.title)}">${esc(choices[d.id]?.note || "")}</textarea>`;
}

const views = {
 waiting(){
  return `<h2 class="tabtitle">Waiting on you</h2><p class="lead">${rich(WAITING_LEAD)}</p>
   ${DECISIONS.map(d => card({id:"d-" + d.id, eyebrow:d.eyebrow, title:d.title, short:d.short, full:d.full, extra:controls(d)})).join("")}`;
 },
 ideas(){
  return `<h2 class="tabtitle">Suggestions</h2><p class="lead">${rich(IDEAS_LEAD)}</p>
   ${IDEAS.map(d => card({id:"i-" + d.id, eyebrow:d.eyebrow, title:d.title, short:d.short, full:d.full, extra:controls({...d, kind:"multi"})})).join("")}`;
 }
};

function renderTabs(){
  $("#tabs").innerHTML = TABS.map(t => `<button type="button" role="tab" data-t="${t.id}" aria-selected="${t.id === tab}">${esc(t.label)}${t.badge() ? `<span class="n">${t.badge()}</span>` : ""}</button>`).join("");
}
function render(){
  renderTabs();
  $("#stamp").textContent = "Updated " + UPDATED;
  $("#panel").innerHTML = views[tab]();
  msg();
}

document.addEventListener("click", e => {
  const b = e.target.closest(".sw button");
  if (b){ const c = b.closest(".card"); const d = b.dataset.f === "d"; detailed[c.dataset.id] = d; c.classList.toggle("detailed", d);
    c.querySelectorAll(".sw button").forEach(x => x.setAttribute("aria-pressed", String((x.dataset.f === "d") === d)));
    try { localStorage.setItem("hub.detail", JSON.stringify(detailed)); } catch {} return; }
  const t = e.target.closest("nav.tabs button");
  if (t){ tab = t.dataset.t; try { localStorage.setItem("hub.tab", tab); } catch {} render(); window.scrollTo(0, 0); }
});
function setAll(d){ document.querySelectorAll(".card").forEach(c => { detailed[c.dataset.id] = d; }); try { localStorage.setItem("hub.detail", JSON.stringify(detailed)); } catch {} render(); }
$("#allShort").onclick = () => setAll(false); $("#allFull").onclick = () => setAll(true);

const tip = $("#tip");
function showTip(el){ const k = el.dataset.k; tip.innerHTML = `<b>${esc(k)}</b>${esc(TERMS[k] || "")}`; tip.hidden = false;
  const r = el.getBoundingClientRect(); const w = Math.min(300, window.innerWidth - 24);
  tip.style.maxWidth = w + "px"; const x = Math.max(12, Math.min(r.left, window.innerWidth - w - 12));
  tip.style.left = x + "px"; const below = r.bottom + 8; tip.style.top = (below + tip.offsetHeight > window.innerHeight - 10 ? r.top - tip.offsetHeight - 8 : below) + "px"; }
document.addEventListener("mouseover", e => { const t = e.target.closest(".term"); if (t) showTip(t); });
document.addEventListener("mouseout", e => { if (e.target.closest(".term")) tip.hidden = true; });
document.addEventListener("focusin", e => { const t = e.target.closest(".term"); if (t) showTip(t); });
document.addEventListener("focusout", e => { if (e.target.closest(".term")) tip.hidden = true; });
document.addEventListener("click", e => { const t = e.target.closest(".term"); if (t){ tip.hidden ? showTip(t) : (tip.hidden = true); } });
window.addEventListener("scroll", () => { tip.hidden = true; }, {passive:true});

/* Choices: kept in this browser until Save, then written to the artifact's db (decisions/owner). */
let choices = {}; let ref = null; let dirty = false; let savedIds = new Set();
try { choices = JSON.parse(localStorage.getItem("hub.choices.r2") || "{}"); } catch {}
const saved = id => savedIds.has(id);
function local(){ try { localStorage.setItem("hub.choices.r2", JSON.stringify(choices)); } catch {} }
function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
function touched(){ dirty = true; local(); msg(); }

document.addEventListener("change", e => {
  const el = e.target; const id = el.dataset.d; if (!id) return; const d = byId(id);
  if (d.kind === "test"){ choices[id] = {...(choices[id] || {}), v: {...(choices[id]?.v || recOf(d)), [el.dataset.row]: el.value}}; }
  else if (d.kind === "multi"){ choices[id] = {...(choices[id] || {}), v: [...document.querySelectorAll(`input[name="dc-${id}"]:checked`)].map(x => x.value)}; }
  else { choices[id] = {...(choices[id] || {}), v: el.value}; }
  document.querySelectorAll(`input[name="dc-${id}"]`).forEach(x => x.closest("label").classList.toggle("on", x.checked));
  touched();
});
document.addEventListener("input", e => { const id = e.target.dataset.note; if (!id) return; const d = byId(id);
  choices[id] = {...(choices[id] || {v: recOf(d)}), note: e.target.value}; touched(); });

function msg(){
  const el = $("#saveMsg"); $("#savebar").classList.toggle("dirty", dirty);
  const differ = ALL().filter(d => d.kind !== "test" && choices[d.id] && JSON.stringify(choices[d.id].v) !== JSON.stringify(d.rec)).length;
  el.textContent = dirty ? `Unsaved changes on this page. ${differ} differ from my recommendation.` : (choices._savedAt ? `Saved ${new Date(choices._savedAt).toLocaleString()}.` : "Not saved yet. Saving without changes accepts all my recommendations.");
  $("#saveState").textContent = ref ? "connected" : "this browser only";
}
async function save(){
  const answers = {}; for (const d of ALL()) answers[d.id] = {v: choices[d.id]?.v ?? recOf(d), note: choices[d.id]?.note || "", recommended: recOf(d)};
  choices._savedAt = new Date().toISOString(); local(); dirty = false;
  if (!ref){ msg(); toast("Saved in this browser only (not connected)"); return; }
  try { await ref.set({round: "2026-10-22", answers, savedAt: choices._savedAt}); toast("Saved. Claude reads these at the start of the next round."); }
  catch { toast("Could not save. Try again."); }
  msg();
}
$("#saveBtn").onclick = save;
render();
(async () => {
  let db = null; try { db = window.claude?.use ? await window.claude.use("db") : null; } catch {}
  if (!db) return;
  ref = db.doc("decisions/owner");
  ref.onSnapshot(snap => {
    if (!snap.exists || dirty) return;
    const data = snap.data();
    if (data.round !== "2026-10-22") return; // last round's answers are already done
    const a = data.answers || {}; savedIds = new Set(Object.keys(a));
    for (const k in a) choices[k] = {v: a[k].v, note: a[k].note || ""};
    choices._savedAt = data.savedAt; local(); render();
  }, () => {});
  msg();
})();
</script>
