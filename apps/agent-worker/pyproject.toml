[project]
name = "sotto-worker"
version = "0.0.0"
description = "Sotto AI worker: customer-track STT, end of turn, playbook lookup, model router, cards."
requires-python = ">=3.12,<3.15"
dependencies = [
  "pydantic==2.14.1",
  "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
  "datamodel-code-generator==0.86.0",
  "jsonschema==4.26.0",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.17.1",
  "types-pyyaml==6.0.12.20260906",
  "types-jsonschema==4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sotto_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
extend = "../../ruff.toml"
extend-exclude = ["sotto_worker/protocol/card.py"]

[tool.mypy]
strict = true
files = ["sotto_worker", "replay", "scripts", "tests", "../../scripts"]
plugins = ["pydantic.mypy"]
exclude = ["scripts/tests/fixtures/"]
