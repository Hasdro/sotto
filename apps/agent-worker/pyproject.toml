[project]
name = "sotto-worker"
version = "0.0.0"
description = "Sotto AI worker: customer-track STT, end of turn, playbook lookup, model router, cards."
requires-python = ">=3.12,<3.15"
dependencies = [
  "anthropic==1.15.0",
  "openai==3.35.1",
  "pydantic==2.14.1",
  "pyyaml==6.0.3",
  "websockets==17.2",
]

[dependency-groups]
dev = [
  "datamodel-code-generator==0.86.0",
  "jsonschema==4.26.0",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.1",
  "types-pyyaml==6.0.12.20260906",
  "types-jsonschema==4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sotto_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --cov=sotto_worker --cov=replay --cov-branch --cov-report=json:coverage.json --cov-report=term:skip-covered"

[tool.ruff]
extend = "../../ruff.toml"
extend-exclude = ["sotto_worker/protocol/card.py", "sotto_worker/protocol/demo.py"]

[tool.mypy]
strict = true
files = ["sotto_worker", "replay", "scripts", "tests", "../../scripts"]
plugins = ["pydantic.mypy"]
exclude = ["scripts/tests/fixtures/"]

[tool.coverage.report]
# Count modules in folders without __init__.py too, so untested code cannot hide.
include_namespace_packages = true
