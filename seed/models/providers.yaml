# Provider catalogue for the Keys & providers panel (P6.7, D-019, D-020).
# Each vendor: where to get a key, the env/vault name of that key, and the route template a stage
# gets when the owner picks this vendor. Model lists are suggestions; "Test" on a key also lists
# the models the vendor reports (LLM vendors). Key pages checked 2026-10-20 (docs/PROVIDER-KEYS.md).
version: 1
providers:
  groq:
    name: Groq
    kind: llm
    key_env: GROQ_API_KEY
    key_page: https://console.groq.com/keys
    free: Free tier, no card
    steps: Sign up, choose Create API Key, name it, copy it (it is shown once).
    route:
      provider: openai_compatible
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
      settings:
        reasoning_effort: low
    models: [openai/gpt-oss-20b, openai/gpt-oss-120b]
  gemini:
    name: Google Gemini
    kind: llm
    key_env: GEMINI_API_KEY
    key_page: https://aistudio.google.com/apikey
    free: Free tier, no card (Google may use free-tier data to improve its models)
    steps: Sign in with a Google account, choose Create API key, copy it.
    route:
      provider: openai_compatible
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      api_key_env: GEMINI_API_KEY
      settings:
        reasoning_effort: none
    models: [gemini-2.5-flash]
  openrouter:
    name: OpenRouter
    kind: llm
    key_env: OPENROUTER_API_KEY
    key_page: https://openrouter.ai/settings/keys
    free: Free models capped at about 50 requests a day
    steps: Sign up, choose Create API Key, set a credit limit, copy it (starts with sk-or-v1-).
    route:
      provider: openai_compatible
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
    models: []
  openai:
    name: OpenAI
    kind: llm
    key_env: OPENAI_API_KEY
    key_page: https://platform.openai.com/api-keys
    free: Paid from the first request
    steps: Sign in, choose Create new secret key, copy it.
    route:
      provider: openai
    test_url: https://api.openai.com/v1/models
    models: []
  anthropic:
    name: Anthropic (Claude)
    kind: llm
    key_env: ANTHROPIC_API_KEY
    key_page: https://console.anthropic.com/settings/keys
    free: Paid
    steps: Sign in, choose Create Key, copy it.
    route:
      provider: anthropic
    test_url: https://api.anthropic.com/v1/models
    models: []
  deepgram:
    name: Deepgram
    kind: stt
    key_env: DEEPGRAM_API_KEY
    key_page: https://console.deepgram.com/
    free: $200 credit, no card
    steps: Sign up. Pick your project, open Settings → API Keys, choose Create a New API Key (Member role), copy it.
    route:
      provider: deepgram
    models: [nova-3]
  assemblyai:
    name: AssemblyAI
    kind: stt
    key_env: ASSEMBLYAI_API_KEY
    key_page: https://www.assemblyai.com/dashboard/home
    free: $50 credit, no card
    steps: Sign up. In the sidebar open API Keys, copy the key or create a new one.
    route:
      provider: assemblyai
    models: [universal-streaming-english]
  speechmatics:
    name: Speechmatics
    kind: stt
    key_env: SPEECHMATICS_API_KEY
    key_page: https://portal.speechmatics.com/api-keys
    free: $100 credit, no card (2 calls at once on the free plan)
    steps: Sign up. Open Settings → API Keys, name the key, copy it (shown once).
    route:
      provider: speechmatics
    models: [standard, enhanced]
  elevenlabs:
    name: ElevenLabs (Scribe)
    kind: stt
    key_env: ELEVENLABS_API_KEY
    key_page: https://elevenlabs.io/app/settings/api-keys
    free: Small free plan without a commercial license; Starter ($6/month) adds it
    steps: Sign up, open Settings → API Keys, choose Create API Key, copy it.
    route:
      provider: elevenlabs
    models: [scribe_v2_realtime]

# Stages the panel lets the owner set, and which kind of vendor each takes.
stages:
  stt: {kind: stt, label: Speech-to-text (main)}
  stt_backup: {kind: stt, label: Speech-to-text (backup)}
  trigger: {kind: llm, label: Question detector}
  suggest: {kind: llm, label: Live suggestion (main)}
  suggest_backup: {kind: llm, label: Live suggestion (backup)}
  summary: {kind: llm, label: After-call summary}
  judge: {kind: llm, label: Quality judge}
