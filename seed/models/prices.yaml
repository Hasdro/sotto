# What one call minute uses, for metering client-reported calls (the apps report minutes and
# card counts, not tokens). Set from `pnpm cost:estimate` (synthetic replay, 2026-11-14); output
# tokens are each route's max_tokens (an upper bound: reasoning models count hidden tokens there).
usage:
  stt_tracks: 2               # customer + agent (agent track as context, D-062 platform default)
  suggest_in_tokens: 700      # per AI card request
  summary_in_tokens: 1500     # per call (transcript + prompt)
  chars_per_token: 4
